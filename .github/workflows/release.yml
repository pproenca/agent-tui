name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Semantic version bump for the next release'
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
      dry_run:
        description: 'Dry run (skip publishing)'
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  validate:
    name: Validate Release
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag_name: ${{ steps.version.outputs.tag_name }}
      dry_run: ${{ steps.resolve.outputs.dry_run }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      head_sha: ${{ steps.sha.outputs.head_sha }}
      ref: ${{ steps.resolve.outputs.ref }}

    steps:
      - name: Resolve release ref
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ref=${{ github.ref }}" >> "$GITHUB_OUTPUT"
            echo "dry_run=${{ inputs.dry_run }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.ref }}" >> "$GITHUB_OUTPUT"
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.ref }}
          fetch-depth: 0

      - name: Validate version consistency
        working-directory: cli
        run: cargo run -p xtask -- version check --quiet

      - name: Resolve head SHA
        id: sha
        run: |
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Resolve release version
        id: version
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BUMP="${{ inputs.bump }}"
            LATEST_TAG="$(git tag --list 'v*' --sort=-v:refname | head -n 1)"
            if [ -n "$LATEST_TAG" ]; then
              BASE_VERSION="${LATEST_TAG#v}"
            else
              BASE_VERSION="$(cargo run -p xtask -- version current)"
            fi
            BASE_VERSION="${BASE_VERSION%%[-+]*}"

            if ! [[ "$BASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Cannot bump non-semver base version: $BASE_VERSION"
              exit 1
            fi

            IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE_VERSION"
            case "$BUMP" in
              major)
                MAJOR=$((MAJOR + 1))
                MINOR=0
                PATCH=0
                ;;
              minor)
                MINOR=$((MINOR + 1))
                PATCH=0
                ;;
              patch)
                PATCH=$((PATCH + 1))
                ;;
              *)
                echo "::error::Unsupported bump type: $BUMP"
                exit 1
                ;;
            esac

            VERSION="${MAJOR}.${MINOR}.${PATCH}"
            TAG_NAME="v$VERSION"
            if git rev-parse -q --verify "refs/tags/$TAG_NAME" >/dev/null; then
              echo "::error::Tag $TAG_NAME already exists"
              exit 1
            fi
          else
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG_NAME#v}"
          fi

          VERSION="$(printf '%s' "$VERSION" | tr -d '\r\n')"

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].+)?$ ]]; then
            echo "::error::Invalid version: $VERSION"
            exit 1
          fi

          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE=true
          else
            PRERELEASE=false
          fi

          {
            echo "version=$VERSION"
            echo "tag_name=$TAG_NAME"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"

  build-artifacts:
    name: Build Release Artifacts (${{ matrix.artifact }})
    needs: [validate]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: agent-tui-linux-x64
            build: cross
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: agent-tui-linux-arm64
            build: cross
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: agent-tui-linux-x64-musl
            build: cross
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            artifact: agent-tui-linux-arm64-musl
            build: cross
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: agent-tui-darwin-x64
            build: cargo
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: agent-tui-darwin-arm64
            build: cargo

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set release version
        working-directory: cli
        run: cargo run -p xtask -- version set "${{ needs.validate.outputs.version }}"

      - name: Install cross
        if: matrix.build == 'cross'
        uses: taiki-e/install-action@cross

      - name: Add Rust target
        if: matrix.build == 'cargo'
        run: rustup target add ${{ matrix.target }}

      - name: Build artifact
        working-directory: cli
        env:
          AGENT_TUI_VERSION: ${{ needs.validate.outputs.version }}
          AGENT_TUI_GIT_SHA: ${{ needs.validate.outputs.head_sha }}
        run: |
          if [ "${{ matrix.build }}" = "cross" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Stage artifact
        run: |
          mkdir -p dist
          cp "cli/target/${{ matrix.target }}/release/agent-tui" "dist/${{ matrix.artifact }}"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [validate, build-artifacts]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.head_sha }}
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Download Linux release artifacts
        uses: actions/download-artifact@v4
        with:
          path: cli/artifacts
          pattern: agent-tui-linux-*

      - name: Download macOS release artifacts
        uses: actions/download-artifact@v4
        with:
          path: cli/artifacts
          pattern: agent-tui-darwin-*

      - name: Verify release artifacts
        working-directory: cli
        run: cargo run -p xtask -- dist verify --input artifacts --kind release

      - name: Prepare release assets
        working-directory: cli
        run: cargo run -p xtask -- dist release --input artifacts --output release

      - name: Generate build provenance attestation
        if: needs.validate.outputs.dry_run != 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: cli/release/agent-tui-*

      - name: Create Release
        if: needs.validate.outputs.dry_run != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.tag_name }}
          target_commitish: ${{ needs.validate.outputs.head_sha }}
          files: cli/release/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ needs.validate.outputs.prerelease == 'true' }}

      - name: Dry run summary
        if: needs.validate.outputs.dry_run == 'true'
        working-directory: cli
        run: |
          {
            echo "## Dry Run Summary"
            echo "Would have released version: ${{ needs.validate.outputs.tag_name }}"
            echo "### Artifacts:"
            ls -la release/
          } >> "$GITHUB_STEP_SUMMARY"

  publish-npm:
    name: Publish to npm
    needs: [release, validate, publish-validate]
    if: needs.validate.outputs.dry_run != 'true' && needs.publish-validate.outputs.npm_skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.head_sha }}
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@11.5.1

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: cli/artifacts

      - name: Set release version
        working-directory: cli
        run: cargo run -p xtask -- version set "${{ needs.validate.outputs.version }}"

      - name: Verify npm artifacts
        working-directory: cli
        run: cargo run -p xtask -- dist verify --input artifacts --kind npm

      - name: Prepare npm package
        working-directory: cli
        run: cargo run -p xtask -- dist npm --input artifacts --output npm

      - name: Publish to npm with provenance
        working-directory: cli
        run: |
          set -euo pipefail
          MISSING="${{ needs.publish-validate.outputs.npm_missing }}"
          if [ -z "$MISSING" ]; then
            echo "No npm packages to publish."
            exit 0
          fi
          for name in $MISSING; do
            if [ "$name" = "agent-tui" ]; then
              echo "Publishing $name"
              npm publish --access public --provenance
              continue
            fi
            dir="npm/$name"
            if [ ! -d "$dir" ]; then
              echo "::error::Missing workspace directory $dir"
              exit 1
            fi
            echo "Publishing $name"
            (cd "$dir" && npm publish --access public --provenance)
          done

  verify-github-install-npm:
    name: Verify GitHub, install script, and npm channels
    needs: [validate, release, publish-validate, publish-npm]
    if: >-
      always() &&
      needs.validate.outputs.dry_run != 'true' &&
      needs.release.result == 'success' &&
      needs.publish-validate.result == 'success' &&
      (needs.publish-npm.result == 'success' || needs.publish-validate.outputs.npm_skip == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.head_sha }}
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify published release channels
        working-directory: cli
        run: |
          set -euo pipefail
          VERSION="${{ needs.validate.outputs.version }}"
          retry() {
            for attempt in 1 2 3 4 5 6; do
              if "$@"; then
                return 0
              fi
              echo "Attempt $attempt failed; waiting for registry propagation..."
              sleep 10
            done
            "$@"
          }

          retry cargo run -p xtask -- release-channels verify \
            --target-version "$VERSION" \
            --channel github-releases \
            --channel install-script \
            --channel npm

      - name: Smoke npm install
        run: |
          set -euo pipefail
          VERSION="${{ needs.validate.outputs.version }}"
          export NPM_CONFIG_PREFIX="$RUNNER_TEMP/npm-global"
          mkdir -p "$NPM_CONFIG_PREFIX"
          retry() {
            for attempt in 1 2 3 4 5 6; do
              if "$@"; then
                return 0
              fi
              echo "Attempt $attempt failed; waiting for npm propagation..."
              sleep 10
            done
            "$@"
          }

          retry npm install -g "agent-tui@$VERSION"
          "$NPM_CONFIG_PREFIX/bin/agent-tui" --version | tee "$RUNNER_TEMP/npm-version.txt"
          grep -F "agent-tui $VERSION" "$RUNNER_TEMP/npm-version.txt"

      - name: Smoke install script pinned binary
        run: |
          set -euo pipefail
          VERSION="${{ needs.validate.outputs.version }}"
          INSTALL_DIR="$RUNNER_TEMP/install-script-bin"
          AGENT_TUI_SKIP_PM=1 \
            AGENT_TUI_VERSION="$VERSION" \
            AGENT_TUI_INSTALL_DIR="$INSTALL_DIR" \
            sh ./install.sh
          "$INSTALL_DIR/agent-tui" --version | tee "$RUNNER_TEMP/install-script-version.txt"
          grep -F "agent-tui $VERSION" "$RUNNER_TEMP/install-script-version.txt"

  publish-validate:
    name: Publish Dry Runs
    needs: [release, validate]
    if: needs.validate.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
    outputs:
      npm_skip: ${{ steps.npm-check.outputs.skip }}
      npm_missing: ${{ steps.npm-check.outputs.missing }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.head_sha }}
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@11.5.1

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: cli/artifacts

      - name: Set release version
        working-directory: cli
        run: cargo run -p xtask -- version set "${{ needs.validate.outputs.version }}"

      - name: Verify npm artifacts
        working-directory: cli
        run: cargo run -p xtask -- dist verify --input artifacts --kind npm

      - name: Prepare npm package
        working-directory: cli
        run: cargo run -p xtask -- dist npm --input artifacts --output npm

      - name: Check if packages already published (npm)
        id: npm-check
        working-directory: cli
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          PACKAGES=$(node -p "const pkg=require('./package.json'); const deps=Object.keys(pkg.optionalDependencies||{}).filter((name)=>name.startsWith('agent-tui-')); [...deps, pkg.name].join(' ')")
          missing=()
          for name in $PACKAGES; do
            if npm view "${name}@${VERSION}" version >/dev/null 2>&1; then
              echo "Found ${name}@${VERSION}"
            else
              missing+=("$name")
            fi
          done
          if [ ${#missing[@]} -eq 0 ]; then
            echo "All npm packages already published for $VERSION"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "missing=" >> "$GITHUB_OUTPUT"
          else
            echo "Missing packages: ${missing[*]}"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "missing=${missing[*]}" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify npm package (dry-run)
        if: steps.npm-check.outputs.skip != 'true'
        working-directory: cli
        run: |
          set -euo pipefail
          MISSING="${{ steps.npm-check.outputs.missing }}"
          for name in $MISSING; do
            if [ "$name" = "agent-tui" ]; then
              echo "Dry-run publish $name"
              npm publish --access public --dry-run
              continue
            fi
            dir="npm/$name"
            if [ ! -d "$dir" ]; then
              echo "::error::Missing workspace directory $dir"
              exit 1
            fi
            echo "Dry-run publish $name"
            (cd "$dir" && npm publish --access public --dry-run)
          done

      - name: Verify crates.io packages
        working-directory: cli
        run: cargo run -p xtask -- release-channels verify-crates-io-publish-plan

  publish-crates:
    name: Publish to crates.io
    needs: [release, validate, publish-validate]
    if: needs.validate.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.head_sha }}
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set release version
        working-directory: cli
        run: cargo run -p xtask -- version set "${{ needs.validate.outputs.version }}"

      - name: Publish crates
        working-directory: cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN secret is required to publish crates.io packages."
            exit 1
          fi

          VERSION="${{ needs.validate.outputs.version }}"
          USER_AGENT="agent-tui-release/${VERSION}"
          crate_published() {
            curl -fsSL \
              -H "User-Agent: $USER_AGENT" \
              "https://crates.io/api/v1/crates/$1/$VERSION" >/dev/null 2>&1
          }
          retry() {
            for attempt in 1 2 3 4 5 6; do
              if "$@"; then
                return 0
              fi
              echo "Attempt $attempt failed; waiting for crates.io propagation..."
              sleep 20
            done
            "$@"
          }

          for crate in \
            agent-tui-common \
            agent-tui-domain \
            agent-tui-usecases \
            agent-tui-adapters \
            agent-tui-infra \
            agent-tui-app \
            agent-tui
          do
            if crate_published "$crate"; then
              echo "$crate@$VERSION already published."
              continue
            fi
            retry cargo publish -p "$crate" --allow-dirty
          done

  verify-crates-source:
    name: Verify crates.io and source install channels
    needs: [validate, release, publish-crates]
    if: >-
      always() &&
      needs.validate.outputs.dry_run != 'true' &&
      needs.release.result == 'success' &&
      needs.publish-crates.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.head_sha }}
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set release version
        working-directory: cli
        run: cargo run -p xtask -- version set "${{ needs.validate.outputs.version }}"

      - name: Verify Rust release channels
        working-directory: cli
        run: |
          set -euo pipefail
          VERSION="${{ needs.validate.outputs.version }}"
          retry() {
            for attempt in 1 2 3 4 5 6; do
              if "$@"; then
                return 0
              fi
              echo "Attempt $attempt failed; waiting for crates.io propagation..."
              sleep 20
            done
            "$@"
          }

          retry cargo run -p xtask -- release-channels verify \
            --target-version "$VERSION" \
            --channel crates-io \
            --channel source-install

      - name: Smoke crates.io install
        run: |
          set -euo pipefail
          VERSION="${{ needs.validate.outputs.version }}"
          CRATES_ROOT="$RUNNER_TEMP/crates-install"
          retry() {
            for attempt in 1 2 3 4 5 6; do
              if "$@"; then
                return 0
              fi
              echo "Attempt $attempt failed; waiting for crates.io propagation..."
              sleep 20
            done
            "$@"
          }

          retry cargo install agent-tui --version "$VERSION" --root "$CRATES_ROOT" --locked
          "$CRATES_ROOT/bin/agent-tui" --version | tee "$RUNNER_TEMP/crates-version.txt"
          grep -F "agent-tui $VERSION" "$RUNNER_TEMP/crates-version.txt"

      - name: Smoke source install
        run: |
          set -euo pipefail
          VERSION="${{ needs.validate.outputs.version }}"
          SOURCE_ROOT="$RUNNER_TEMP/source-install"
          cargo install --path cli/crates/agent-tui --root "$SOURCE_ROOT" --locked --force
          "$SOURCE_ROOT/bin/agent-tui" --version | tee "$RUNNER_TEMP/source-version.txt"
          grep -F "agent-tui $VERSION" "$RUNNER_TEMP/source-version.txt"

  publish-homebrew:
    name: Publish Homebrew tap
    needs: [validate, release]
    if: needs.validate.outputs.dry_run != 'true' && needs.release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    steps:
      - name: Ensure Homebrew tap token
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${HOMEBREW_TAP_TOKEN:-}" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN secret is required to update pproenca/homebrew-tap."
            exit 1
          fi

      - name: Checkout Homebrew tap
        uses: actions/checkout@v4
        with:
          repository: pproenca/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Download macOS release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: agent-tui-darwin-*

      - name: Update formula
        run: |
          set -euo pipefail
          VERSION="${{ needs.validate.outputs.version }}"
          TAG="${{ needs.validate.outputs.tag_name }}"
          ARM_ASSET="release-artifacts/agent-tui-darwin-arm64/agent-tui-darwin-arm64"
          X64_ASSET="release-artifacts/agent-tui-darwin-x64/agent-tui-darwin-x64"
          ARM_SHA="$(sha256sum "$ARM_ASSET" | awk '{print $1}')"
          X64_SHA="$(sha256sum "$X64_ASSET" | awk '{print $1}')"

          mkdir -p homebrew-tap/Formula
          cat > homebrew-tap/Formula/agent-tui.rb <<EOF
          class AgentTui < Formula
            desc "CLI tool for AI agents to interact with TUI applications"
            homepage "https://github.com/pproenca/agent-tui"
            version "$VERSION"
            license "MIT"

            depends_on :macos

            on_macos do
              on_arm do
                url "https://github.com/pproenca/agent-tui/releases/download/$TAG/agent-tui-darwin-arm64"
                sha256 "$ARM_SHA"
              end

              on_intel do
                url "https://github.com/pproenca/agent-tui/releases/download/$TAG/agent-tui-darwin-x64"
                sha256 "$X64_SHA"
              end
            end

            def install
              bin.install Dir["agent-tui-darwin-*"].first => "agent-tui"
              chmod 0755, bin/"agent-tui"
            end

            test do
              assert_match "agent-tui #{version}", shell_output("#{bin}/agent-tui --version")
            end
          end
          EOF

      - name: Commit formula
        working-directory: homebrew-tap
        run: |
          set -euo pipefail
          VERSION="${{ needs.validate.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- Formula/agent-tui.rb; then
            echo "Homebrew formula already up to date for $VERSION."
            exit 0
          fi
          git add Formula/agent-tui.rb
          git commit -m "Update agent-tui to $VERSION"
          git push

  verify-homebrew:
    name: Verify Homebrew channel
    needs: [validate, release, publish-homebrew]
    if: >-
      always() &&
      needs.validate.outputs.dry_run != 'true' &&
      needs.release.result == 'success' &&
      needs.publish-homebrew.result == 'success'
    runs-on: macos-latest
    permissions:
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.head_sha }}
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Verify Homebrew release channel
        working-directory: cli
        run: |
          set -euo pipefail
          VERSION="${{ needs.validate.outputs.version }}"
          retry() {
            for attempt in 1 2 3 4 5 6; do
              if "$@"; then
                return 0
              fi
              echo "Attempt $attempt failed; waiting for Homebrew tap propagation..."
              sleep 20
            done
            "$@"
          }

          retry cargo run -p xtask -- release-channels verify \
            --target-version "$VERSION" \
            --channel homebrew

      - name: Smoke Homebrew install and upgrade
        run: |
          set -euo pipefail
          VERSION="${{ needs.validate.outputs.version }}"
          brew update
          brew tap pproenca/tap https://github.com/pproenca/homebrew-tap
          brew install pproenca/tap/agent-tui
          brew upgrade pproenca/tap/agent-tui
          agent-tui --version | tee "$RUNNER_TEMP/homebrew-version.txt"
          grep -F "agent-tui $VERSION" "$RUNNER_TEMP/homebrew-version.txt"
