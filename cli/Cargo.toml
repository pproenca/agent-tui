[workspace]
members = [
    "crates/agent-tui",
    "crates/agent-tui-common",
    "crates/agent-tui-domain",
    "crates/agent-tui-usecases",
    "crates/agent-tui-adapters",
    "crates/agent-tui-infra",
    "crates/agent-tui-app",
    "crates/xtask",
]
resolver = "2"

[workspace.package]
version = "1.0.2"
edition = "2024"
rust-version = "1.93"
license = "MIT"
repository = "https://github.com/pproenca/agent-tui"

[workspace.dependencies]
# Internal
agent-tui-common = { version = "1.0.2", path = "crates/agent-tui-common" }
agent-tui-domain = { version = "1.0.2", path = "crates/agent-tui-domain" }
agent-tui-usecases = { version = "1.0.2", path = "crates/agent-tui-usecases" }
agent-tui-adapters = { version = "1.0.2", path = "crates/agent-tui-adapters" }
agent-tui-infra = { version = "1.0.2", path = "crates/agent-tui-infra" }
agent-tui-app = { version = "1.0.2", path = "crates/agent-tui-app" }

# External (pinned)
anyhow = "1"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.49", features = ["full"] }
uuid = { version = "1.19", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"
crossterm = "0.29"
base64 = "0.22"
portable-pty = "0.9"
rand = "0.9"
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["cors"] }
libc = "0.2"
signal-hook = "0.4"
sysinfo = "0.33"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
tattoy-wezterm-term = "0.1.0-fork.5"
tattoy-wezterm-surface = "0.1.0-fork.2"
crossbeam-channel = "0.5"
bytes = "1.11.1"
shell-words = "1.1"
url = "2.5"
tungstenite = "0.24"
assert_cmd = "2.1"
predicates = "3.1"
tempfile = "3.24"
once_cell = "1.19"
cargo_metadata = "0.23"
sha2 = "0.10"
walkdir = "2.5"
insta = "1.43"

[workspace.lints]
rust = {}

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
identity_op = "deny"
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
disallowed_methods = "deny"
manual_clamp = "deny"
manual_filter = "deny"
manual_find = "deny"
manual_flatten = "deny"
manual_map = "deny"
manual_memcpy = "deny"
manual_non_exhaustive = "deny"
manual_ok_or = "deny"
manual_range_contains = "deny"
manual_retain = "deny"
manual_strip = "deny"
manual_try_fold = "deny"
manual_unwrap_or = "deny"
needless_borrow = "deny"
needless_borrowed_reference = "deny"
needless_collect = "deny"
needless_late_init = "deny"
needless_option_as_deref = "deny"
needless_question_mark = "deny"
needless_update = "deny"
redundant_clone = "deny"
redundant_closure = "deny"
redundant_closure_for_method_calls = "deny"
redundant_static_lifetimes = "deny"
trivially_copy_pass_by_ref = "deny"
uninlined_format_args = "deny"
unnecessary_filter_map = "deny"
unnecessary_lazy_evaluations = "deny"
unnecessary_sort_by = "deny"
unnecessary_to_owned = "deny"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
