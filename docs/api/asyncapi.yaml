asyncapi: 2.6.0
info:
  title: agent-tui Live Preview WebSocket API
  version: "1"
  description: |
    JSON-RPC WebSocket API for live-preview terminal output and flightdeck session inventory.

    Authentication is required. Read the daemon WS state file to obtain the authenticated
    websocket URL, then connect to `/ws` or `/api/v1/stream` with the `token` query parameter.

    Browser requests are limited to the daemon's own origin. Binary frames are not part of the
    live-preview data plane; terminal output is delivered as base64 in JSON-RPC `result` payloads.
servers:
  local:
    url: ws://127.0.0.1:{port}/ws?token={token}
    protocol: ws
    description: |
      Local daemon websocket endpoint. Read the effective URL and token from the daemon WS state file
      (`AGENT_TUI_WS_STATE`, default `~/.agent-tui/api.json`).
    variables:
      port:
        default: "0"
      token:
        default: "<token>"
channels:
  /ws:
    description: Primary authenticated JSON-RPC websocket endpoint.
    publish:
      summary: Client sends JSON-RPC stream requests.
      message:
        oneOf:
          - $ref: '#/components/messages/LivePreviewStreamRequest'
          - $ref: '#/components/messages/FlightdeckStreamRequest'
    subscribe:
      summary: Daemon sends JSON-RPC success and error envelopes.
      message:
        oneOf:
          - $ref: '#/components/messages/JsonRpcSuccessEnvelope'
          - $ref: '#/components/messages/JsonRpcErrorEnvelope'
  /api/v1/stream:
    description: Legacy alias for `/ws`.
    publish:
      summary: Client sends JSON-RPC stream requests.
      message:
        oneOf:
          - $ref: '#/components/messages/LivePreviewStreamRequest'
          - $ref: '#/components/messages/FlightdeckStreamRequest'
    subscribe:
      summary: Daemon sends JSON-RPC success and error envelopes.
      message:
        oneOf:
          - $ref: '#/components/messages/JsonRpcSuccessEnvelope'
          - $ref: '#/components/messages/JsonRpcErrorEnvelope'
components:
  messages:
    LivePreviewStreamRequest:
      name: live_preview_stream_request
      contentType: application/json
      payload:
        $ref: '#/components/schemas/LivePreviewStreamRequestEnvelope'
    FlightdeckStreamRequest:
      name: flightdeck_stream_request
      contentType: application/json
      payload:
        $ref: '#/components/schemas/FlightdeckStreamRequestEnvelope'
    JsonRpcSuccessEnvelope:
      name: jsonrpc_success_envelope
      contentType: application/json
      payload:
        $ref: '#/components/schemas/JsonRpcSuccessEnvelope'
    JsonRpcErrorEnvelope:
      name: jsonrpc_error_envelope
      contentType: application/json
      payload:
        $ref: '#/components/schemas/JsonRpcErrorEnvelope'
  schemas:
    LivePreviewStreamRequestEnvelope:
      type: object
      required: [jsonrpc, id, method]
      properties:
        jsonrpc:
          type: string
          enum: ["2.0"]
        id:
          type: integer
          format: int64
        method:
          type: string
          enum: [live_preview_stream]
        params:
          type: object
          properties:
            session:
              type: string
              description: Session id or `"active"` to follow the active session.
    FlightdeckStreamRequestEnvelope:
      type: object
      required: [jsonrpc, id, method]
      properties:
        jsonrpc:
          type: string
          enum: ["2.0"]
        id:
          type: integer
          format: int64
        method:
          type: string
          enum: [flightdeck_stream]
        params:
          type: object
          properties:
            interval_ms:
              type: integer
              format: int64
              minimum: 250
              maximum: 5000
              default: 1000
    JsonRpcSuccessEnvelope:
      type: object
      required: [jsonrpc, id, result]
      properties:
        jsonrpc:
          type: string
          enum: ["2.0"]
        id:
          type: integer
          format: int64
        result:
          oneOf:
            - $ref: '#/components/schemas/LivePreviewReady'
            - $ref: '#/components/schemas/FlightdeckReady'
            - $ref: '#/components/schemas/FlightdeckSessions'
            - $ref: '#/components/schemas/LivePreviewInit'
            - $ref: '#/components/schemas/LivePreviewOutput'
            - $ref: '#/components/schemas/LivePreviewDropped'
            - $ref: '#/components/schemas/LivePreviewResize'
            - $ref: '#/components/schemas/Heartbeat'
            - $ref: '#/components/schemas/Closed'
    JsonRpcErrorEnvelope:
      type: object
      required: [jsonrpc, id, error]
      properties:
        jsonrpc:
          type: string
          enum: ["2.0"]
        id:
          type: integer
          format: int64
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: integer
              format: int32
            message:
              type: string
    LivePreviewReady:
      type: object
      required: [event, session_id, cols, rows]
      properties:
        event:
          type: string
          enum: [ready]
        session_id:
          type: string
        cols:
          type: integer
          format: int32
        rows:
          type: integer
          format: int32
    FlightdeckReady:
      type: object
      required: [event, sessions]
      properties:
        event:
          type: string
          enum: [ready]
        active_session:
          type: string
          nullable: true
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/SessionInfo'
    FlightdeckSessions:
      type: object
      required: [event, sessions, time]
      properties:
        event:
          type: string
          enum: [sessions]
        active_session:
          type: string
          nullable: true
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/SessionInfo'
        time:
          type: number
    LivePreviewInit:
      type: object
      required: [event, time, cols, rows, init]
      properties:
        event:
          type: string
          enum: [init]
        time:
          type: number
        cols:
          type: integer
          format: int32
        rows:
          type: integer
          format: int32
        init:
          type: string
          description: Full terminal render for stream initialization or re-sync after dropped bytes.
    LivePreviewOutput:
      type: object
      required: [event, time, data_b64]
      properties:
        event:
          type: string
          enum: [output]
        time:
          type: number
        data_b64:
          type: string
          description: Base64-encoded terminal output bytes.
    LivePreviewDropped:
      type: object
      required: [event, time, dropped_bytes]
      properties:
        event:
          type: string
          enum: [dropped]
        time:
          type: number
        dropped_bytes:
          type: integer
    LivePreviewResize:
      type: object
      required: [event, time, cols, rows]
      properties:
        event:
          type: string
          enum: [resize]
        time:
          type: number
        cols:
          type: integer
          format: int32
        rows:
          type: integer
          format: int32
    Heartbeat:
      type: object
      required: [event, time]
      properties:
        event:
          type: string
          enum: [heartbeat]
        time:
          type: number
    Closed:
      type: object
      required: [event, time]
      properties:
        event:
          type: string
          enum: [closed]
        time:
          type: number
    SessionInfo:
      type: object
      required: [id, command, pid, running, created_at, size]
      properties:
        id:
          type: string
        command:
          type: string
        pid:
          type: integer
          format: int64
        running:
          type: boolean
        created_at:
          type: string
        size:
          type: object
          required: [cols, rows]
          properties:
            cols:
              type: integer
              format: int32
            rows:
              type: integer
              format: int32
