openapi: 3.0.3
info:
  title: agent-tui Live Preview HTTP Surface
  version: "1"
  description: |
    HTTP surface exposed by the local daemon for live preview.

    The built-in browser UI is served at `/ui`. Live-preview and flightdeck streams run over
    JSON-RPC on authenticated WebSocket endpoints at `/ws` and `/api/v1/stream`.

    Browser clients must use the daemon-provided `ws` query parameter when opening `/ui`.
    WebSocket upgrades require the `token` query parameter and browser requests are limited to
    the daemon's own origin.
servers:
  - url: http://127.0.0.1:{port}
    description: |
      Local daemon endpoint. Read the effective port and authenticated websocket URL from the
      daemon WS state file (`AGENT_TUI_WS_STATE`, default `~/.agent-tui/api.json`).
    variables:
      port:
        default: "0"
paths:
  /:
    get:
      summary: Redirect to the built-in live preview UI
      responses:
        '307':
          description: Redirect to `/ui?ws=<encoded-authenticated-ws-url>`
  /ui:
    get:
      summary: Built-in live preview web UI
      description: |
        Serves the browser client for live preview and flightdeck session inspection.
        The browser contract expects the daemon-provided authenticated websocket URL in the
        `ws` query parameter.
      parameters:
        - name: ws
          in: query
          required: true
          description: Authenticated daemon websocket URL emitted by the local daemon.
          schema:
            type: string
            format: uri
        - name: session
          in: query
          required: false
          description: Session selector for the built-in client. `"active"` follows the active session.
          schema:
            type: string
            default: active
        - name: auto
          in: query
          required: false
          description: Auto-connect toggle for the built-in client.
          schema:
            type: string
            enum: ["0", "1", "false", "true"]
            default: "1"
      responses:
        '200':
          description: HTML document for the built-in live preview UI.
  /ws:
    get:
      summary: Authenticated JSON-RPC WebSocket endpoint
      description: |
        WebSocket upgrade endpoint for live-preview and flightdeck streams.

        Clients send JSON-RPC requests such as `live_preview_stream` and `flightdeck_stream`
        after the upgrade succeeds. See `asyncapi.yaml` for the request and response envelopes.
      security:
        - WsTokenQuery: []
      responses:
        '101':
          description: Switching Protocols
        '401':
          description: Missing or invalid websocket token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonRpcErrorEnvelope'
        '403':
          description: Browser `Origin` does not match the daemon UI origin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonRpcErrorEnvelope'
        '503':
          description: Too many websocket connections.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonRpcErrorEnvelope'
  /api/v1/stream:
    get:
      summary: Legacy alias for `/ws`
      description: |
        Authenticated JSON-RPC WebSocket endpoint equivalent to `/ws`.
        Existing clients may continue to use this alias.
      security:
        - WsTokenQuery: []
      responses:
        '101':
          description: Switching Protocols
        '401':
          description: Missing or invalid websocket token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonRpcErrorEnvelope'
        '403':
          description: Browser `Origin` does not match the daemon UI origin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonRpcErrorEnvelope'
        '503':
          description: Too many websocket connections.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonRpcErrorEnvelope'
components:
  securitySchemes:
    WsTokenQuery:
      type: apiKey
      in: query
      name: token
      description: |
        Authenticated websocket token from the daemon WS state file.
  schemas:
    JsonRpcErrorEnvelope:
      type: object
      required: [jsonrpc, id, error]
      properties:
        jsonrpc:
          type: string
          enum: ["2.0"]
        id:
          type: integer
          format: int64
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: integer
              format: int32
            message:
              type: string
